name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: notify.exe
            asset: notify-Windows.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: notify
            asset: notify-macOS-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: notify
            asset: notify-macOS-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: notify
            asset: notify-Linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libx11-dev libxtst-dev libxi-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --target "${{ matrix.target }}"
          else
            cargo build --release
          fi

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          if [ -n "${{ matrix.target }}" ]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"
          else
            cp "target/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"
          fi

      - name: Build installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer.iss

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
