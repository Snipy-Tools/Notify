[package]
name = "notify"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
global-hotkey = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tao = "0.37.1"
tray-icon = "0.26.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Console", "Win32_System_Registry"] }
wry = "0.57.0"

[dev-dependencies]
tempfile = "3.27.0"
