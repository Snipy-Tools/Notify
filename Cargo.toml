[package]
name = "notify"
version = "0.1.0"
edition = "2024"

[dependencies]
# Deflate zum Lesen der Word-Vorlage (.docx ist ein ZIP), nur Rust-Backend, bereits im Cargo-Cache
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
global-hotkey = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tao = "0.37.1"
tray-icon = "0.26.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_Graphics_Gdi", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell_Common"] }
wry = "0.57.0"

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1"
