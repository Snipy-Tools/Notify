<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<!--BASE-->
<style>
.rem {
    position: relative;
    height: 100%;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 22px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--r-window);
    overflow: hidden;
}
.bell { width: 44px; height: 44px; border-radius: 50%; background: var(--muted); color: var(--hinweis); display: flex; align-items: center; justify-content: center; flex: none; }
.body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.txt { display: flex; flex-direction: column; gap: 3px; padding-right: 14px; }
.top { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 8px; }
.top .title { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.sub { font-size: 12px; color: var(--mfg); line-height: 1.4; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.actions { display: flex; gap: 8px; }
.actions .btn { height: 34px; border-radius: 10px; padding: 0 16px; }
.actions .btn:not(.primary) { padding: 0 14px; }
.x { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 8px; }
</style>
</head>
<body>
<div class="rem">
    <div class="bell"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg></div>
    <div class="body">
        <div class="txt">
            <div class="top"><span class="title" id="title">Eintrag fällig</span><span class="badge" id="badge" hidden></span></div>
            <div class="sub" id="text"></div>
        </div>
        <div class="actions">
            <button class="btn primary" id="now">Jetzt eintragen</button>
            <button class="btn" id="snooze">In 15 min</button>
        </div>
    </div>
    <button class="icon-btn x" id="close" aria-label="Schliessen"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
</div>
<script>
const send = (msg) => window.ipc.postMessage(JSON.stringify(msg));
const $ = (id) => document.getElementById(id);

// Rust ruft diese Funktion auf
function onHint(h) {
    $("title").textContent = h.title;
    $("badge").hidden = !h.badge;
    $("badge").textContent = h.badge || "";
    $("text").textContent = h.text;
    $("text").title = h.text;
    $("now").textContent = h.button;
    $("snooze").textContent = h.snooze;
}

$("now").onclick = () => send({ op: "now" });
$("snooze").onclick = () => send({ op: "snooze" });
$("close").onclick = () => send({ op: "close" });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") send({ op: "close" }); });
document.addEventListener("contextmenu", (e) => e.preventDefault());
</script>
</body>
</html>
