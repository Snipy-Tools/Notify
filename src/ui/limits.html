<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<!--BASE-->
<style>
.lim {
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 22px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--r-window);
    overflow: hidden;
}
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: grab; }
.head .title { font-size: 15px; font-weight: 600; }
.head .age { font-size: 11px; color: var(--mfg); white-space: nowrap; font-variant-numeric: tabular-nums; }
.rows { display: flex; flex-direction: column; gap: 14px; flex: 1; min-height: 0; }
.row {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border-radius: var(--r-card);
    padding: 10px 14px;
}
.row .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .name { font-size: 13px; font-weight: 500; }
.row .sub { font-size: 12px; color: var(--mfg); line-height: 1.35; text-wrap: balance; font-variant-numeric: tabular-nums; }
.row .sub.full { color: var(--fg); }
.row .pct { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 2.7em; text-align: right; }
.row.empty .pct { color: #5c5c5c; }
.none { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--mfg); font-size: 13px; line-height: 1.5; padding: 0 12px; }
</style>
</head>
<body>
<div class="lim" id="lim">
    <div class="head" id="head"><span class="title">Claude-Limits</span><span class="age" id="age"></span></div>
    <div class="rows" id="rows"></div>
</div>
<script>
const send = (msg) => window.ipc.postMessage(JSON.stringify(msg));
const $ = (id) => document.getElementById(id);

function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
}

// Ringfarben aus den Einstellungen (Rust liefert gültige "#rrggbb")
function applyRingColors(c) {
    if (!c) return;
    const st = document.documentElement.style;
    st.setProperty("--ring-five", c.five_hour);
    st.setProperty("--ring-week", c.seven_day);
    st.setProperty("--ring-ctx", c.context);
    st.setProperty("--ring-warn", c.warn);
    st.setProperty("--ring-crit", c.crit);
}

function ringSvg(r) {
    let g = '<circle class="rg track" cx="20" cy="20" r="16" stroke-width="4"/>';
    if (r.pct) {
        const warn = r.level === "ok" ? "" : " r-" + r.level;
        g += '<circle class="rg r-' + r.key + warn + '" cx="20" cy="20" r="16" stroke-width="4" stroke-dasharray="' + r.dash_card + '"/>';
    }
    return '<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><g transform="rotate(-90 20 20)">' + g + '</g></svg>';
}

function row(r) {
    const e = el("div", "row" + (r.pct === null ? " empty" : ""));
    const holder = el("span");
    holder.style.display = "flex";
    holder.innerHTML = ringSvg(r);
    const txt = el("div", "txt");
    txt.append(el("span", "name", r.label), el("span", "sub" + (r.reached ? " full" : ""), r.detail));
    e.append(holder, txt, el("span", "pct", r.pct === null ? "–" : r.pct + "%"));
    return e;
}

// Rust ruft diese Funktion auf (und frischt sie alle paar Sekunden auf, solange die Karte offen ist)
function onLimits(d) {
    if (!d) {
        $("age").textContent = "";
        $("rows").replaceChildren(el("div", "none", "Keine aktuellen Daten. Die Werte kommen von der Statuszeile von Claude Code."));
        return;
    }
    applyRingColors(d.colors);
    $("age").textContent = d.age;
    $("rows").replaceChildren(...d.rings.map(row));
}

document.addEventListener("keydown", (e) => { if (e.key === "Escape") send({ op: "close" }); });
document.addEventListener("contextmenu", (e) => e.preventDefault());
</script>
</body>
</html>
